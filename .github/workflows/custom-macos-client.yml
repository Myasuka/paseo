name: Custom macOS Client

on:
  push:
    branches:
      - custom/mac-client
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted macOS runner label"
        required: false
        default: "macos-26-intel"
        type: choice
        options:
          - macos-26-intel
          - macos-latest
          - macos-15-intel

concurrency:
  group: custom-macos-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  macos-arm64:
    name: Build macOS arm64 (.dmg & .zip)
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build web renderer, server, and desktop main
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          npm run build:app-deps:clean
          (
            cd packages/app
            npx cross-env PASEO_WEB_PLATFORM=electron npx expo export --platform web
          )
          npm run build:server:clean
          npm --prefix packages/desktop run build:main

      - name: Smoke-test packaged desktop app on host architecture before arm64 cross-packaging
        shell: bash
        env:
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            echo "Host is native arm64; packaged smoke test will run directly on the arm64 bundle."
            exit 0
          fi
          (
            cd packages/desktop
            npx electron-builder \
              --config electron-builder.yml \
              --publish never \
              --dir \
              --mac \
              --x64 \
              -c.publish.owner=Myasuka \
              -c.publish.repo=paseo \
              -c.mac.identity=- \
              -c.mac.hardenedRuntime=false \
              -c.mac.notarize=false
          )
          rm -rf packages/desktop/release

      - name: Hydrate darwin-arm64 runtime prebuilds when cross-packaging on x64
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            echo "Host is native arm64; darwin-arm64 optionalDependencies were installed by npm ci."
            exit 0
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");

          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const targets = [
            "node_modules/@img/sharp-darwin-arm64",
            "node_modules/@img/sharp-libvips-darwin-arm64",
            "node_modules/sherpa-onnx-darwin-arm64",
            "node_modules/@msgpackr-extract/msgpackr-extract-darwin-arm64",
            "node_modules/@esbuild/darwin-arm64",
            "packages/server/node_modules/@esbuild/darwin-arm64",
          ];
          const tmpDir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || "/tmp", "arm64-prebuilds-"));

          for (const relTarget of targets) {
            const meta = lock.packages[relTarget];
            if (!meta?.resolved || !meta?.integrity) {
              throw new Error(`Missing lockfile metadata for ${relTarget}`);
            }
            const tgzPath = path.join(tmpDir, `${relTarget.replace(/[/@]/g, "_")}.tgz`);
            execFileSync("curl", ["-fsSL", "--retry", "3", "-o", tgzPath, meta.resolved], { stdio: "inherit" });

            const [algo, expectedBase64] = meta.integrity.split("-", 2);
            const actualBase64 = crypto.createHash(algo).update(fs.readFileSync(tgzPath)).digest("base64");
            if (actualBase64 !== expectedBase64) {
              throw new Error(`Integrity mismatch for ${relTarget}: expected ${expectedBase64}, got ${actualBase64}`);
            }

            fs.rmSync(relTarget, { recursive: true, force: true });
            fs.mkdirSync(relTarget, { recursive: true });
            execFileSync("tar", ["-xzf", tgzPath, "--strip-components=1", "-C", relTarget], { stdio: "inherit" });
            console.log(`Hydrated ${relTarget}@${meta.version}`);
          }

          for (const [arm64Bin, wrapperBin] of [
            ["node_modules/@esbuild/darwin-arm64/bin/esbuild", "node_modules/esbuild/bin/esbuild"],
            [
              "packages/server/node_modules/@esbuild/darwin-arm64/bin/esbuild",
              "packages/server/node_modules/esbuild/bin/esbuild",
            ],
          ]) {
            if (fs.existsSync(arm64Bin) && fs.existsSync(path.dirname(wrapperBin))) {
              fs.rmSync(wrapperBin, { force: true });
              fs.copyFileSync(arm64Bin, wrapperBin);
              fs.chmodSync(wrapperBin, 0o755);
              console.log(`Updated ${wrapperBin} -> ${arm64Bin}`);
            }
          }

          for (const x64Dir of [
            "node_modules/@img/sharp-darwin-x64",
            "node_modules/@img/sharp-libvips-darwin-x64",
            "node_modules/sherpa-onnx-darwin-x64",
            "node_modules/@msgpackr-extract/msgpackr-extract-darwin-x64",
            "node_modules/@esbuild/darwin-x64",
            "packages/server/node_modules/@esbuild/darwin-x64",
          ]) {
            fs.rmSync(x64Dir, { recursive: true, force: true });
          }
          NODE

      - name: Package, ad-hoc sign, smoke-test, and verify macOS arm64 (.dmg & .zip)
        shell: bash
        env:
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            export PASEO_DESKTOP_SMOKE="1"
          else
            export PASEO_DESKTOP_SMOKE="0"
          fi
          (
            cd packages/desktop
            npx electron-builder \
              --config electron-builder.yml \
              --publish never \
              --mac \
              --arm64 \
              -c.publish.owner=Myasuka \
              -c.publish.repo=paseo \
              -c.mac.identity=- \
              -c.mac.hardenedRuntime=false \
              -c.mac.notarize=false
          )

          APP_BUNDLE="packages/desktop/release/mac-arm64/Paseo.app"
          echo "=== Verify main executable architecture ==="
          MAIN_INFO="$(file "$APP_BUNDLE/Contents/MacOS/Paseo")"
          echo "$MAIN_INFO"
          [[ "$MAIN_INFO" == *"Mach-O 64-bit executable arm64"* ]]

          echo "=== Verify unpacked Mach-O native addons are arm64 ==="
          while IFS= read -r -d '' addon; do
            ADDON_INFO="$(file "$addon")"
            echo "$ADDON_INFO"
            if [[ "$ADDON_INFO" == *"Mach-O"* && "$ADDON_INFO" != *"arm64"* ]]; then
              echo "ERROR: non-arm64 Mach-O addon found: $addon" >&2
              exit 1
            fi
          done < <(find "$APP_BUNDLE" \( -name "*.node" -o -name "*.dylib" -o -name "spawn-helper" -o -name "esbuild" \) -print0)

          echo "=== Verify ASAR and unpacked sharp/runtime prebuilds match darwin-arm64 ==="
          APP_BUNDLE="$APP_BUNDLE" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const asar = require("@electron/asar");

          const appBundle = process.env.APP_BUNDLE;
          const asarPath = path.join(appBundle, "Contents", "Resources", "app.asar");
          const unpackedDir = path.join(appBundle, "Contents", "Resources", "app.asar.unpacked");

          const asarEntries = asar.listPackage(asarPath, { isPack: false });
          const unpackedEntries = [];
          if (fs.existsSync(unpackedDir)) {
            for (const entry of fs.readdirSync(unpackedDir, { withFileTypes: true, recursive: true })) {
              const parent = entry.parentPath || entry.path;
              const rel = path.relative(unpackedDir, path.join(parent, entry.name)).replaceAll(path.sep, "/");
              unpackedEntries.push(`/${rel}`);
            }
          }

          const allEntries = [...asarEntries, ...unpackedEntries];
          for (const requiredPkg of ["@img/sharp-darwin-arm64", "@img/sharp-libvips-darwin-arm64"]) {
            if (!allEntries.some((entry) => entry.includes(requiredPkg))) {
              throw new Error(`Missing required arm64 prebuild in app bundle: ${requiredPkg}`);
            }
          }

          const forbiddenX64 = [
            "sharp-darwin-x64",
            "sharp-libvips-darwin-x64",
            "sherpa-onnx-darwin-x64",
            "msgpackr-extract-darwin-x64",
            "@esbuild/darwin-x64",
          ];
          const unexpected = allEntries.filter((entry) => forbiddenX64.some((bad) => entry.includes(bad)));
          if (unexpected.length > 0) {
            throw new Error(`Found forbidden darwin-x64 runtime entries in app bundle:\n${unexpected.slice(0, 20).join("\n")}`);
          }
          console.log(
            `Verified app.asar (${asarEntries.length} entries) and app.asar.unpacked (${unpackedEntries.length} entries): sharp arm64 present, 0 darwin-x64 runtime packages.`,
          );
          NODE

          echo "=== Verify bundled resources, updater target, & Apple code signature ==="
          test -f "$APP_BUNDLE/Contents/Resources/app-dist/index.html"
          test -d "$APP_BUNDLE/Contents/Resources/builtin-plugins"
          test -x "$APP_BUNDLE/Contents/Resources/bin/paseo"
          if [[ -f "$APP_BUNDLE/Contents/Resources/app-update.yml" ]]; then
            cat "$APP_BUNDLE/Contents/Resources/app-update.yml"
            grep -q "owner: Myasuka" "$APP_BUNDLE/Contents/Resources/app-update.yml"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 || true

          DMG_FILE="$(basename "$(ls packages/desktop/release/*-arm64.dmg | head -n 1)")"
          INSTALLER_PATH="packages/desktop/release/install-macos.sh"
          cat > "$INSTALLER_PATH" <<'INSTALLER_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          REPO="${PASEO_RELEASE_REPO:-Myasuka/paseo}"
          TAG="${PASEO_RELEASE_TAG:-custom-macos-client}"
          DMG_NAME="__DMG_FILE__"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          if [[ "$(uname -s)" != "Darwin" ]]; then
            echo "Error: install-macos.sh must be run on macOS (detected $(uname -s))." >&2
            echo "Please run this command inside Terminal / iTerm2 on your Mac." >&2
            exit 1
          fi

          ARCH="$(uname -m)"
          if [[ "$ARCH" != "arm64" ]]; then
            echo "Error: Prebuilt installer targets Apple Silicon (arm64), detected ${ARCH}." >&2
            exit 1
          fi

          TMP_DIR="$(mktemp -d "${TMPDIR:-/tmp}/paseo-custom-install.XXXXXX")"
          MNT_DIR="${TMP_DIR}/mnt"
          mkdir -p "$MNT_DIR"

          cleanup() {
            if mount | grep -Fq "on ${MNT_DIR} "; then
              hdiutil detach "$MNT_DIR" -quiet || hdiutil detach "$MNT_DIR" -force -quiet || true
            fi
            rm -rf "$TMP_DIR"
          }
          trap cleanup EXIT

          echo "==> Downloading ${DMG_NAME} and SHA256SUMS.txt from ${REPO}@${TAG} ..."
          curl -fL --retry 3 -o "${TMP_DIR}/SHA256SUMS.txt" "${BASE_URL}/SHA256SUMS.txt"
          curl -fL --retry 3 --progress-bar -o "${TMP_DIR}/${DMG_NAME}" "${BASE_URL}/${DMG_NAME}"

          echo "==> Verifying SHA256 checksum ..."
          EXPECTED_SHA="$(awk -v rel="./${DMG_NAME}" -v bare="${DMG_NAME}" '$2 == rel || $2 == bare { print $1; exit }' "${TMP_DIR}/SHA256SUMS.txt")"
          ACTUAL_SHA="$(shasum -a 256 "${TMP_DIR}/${DMG_NAME}" | awk '{ print $1 }')"
          if [[ -z "$EXPECTED_SHA" || "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Error: SHA256 mismatch for ${DMG_NAME} (expected ${EXPECTED_SHA:-missing}, got ${ACTUAL_SHA})" >&2
            exit 1
          fi
          echo "    SHA256 verified: ${ACTUAL_SHA}"

          INSTALL_DIR="${PASEO_INSTALL_DIR:-/Applications}"
          if [[ ! -w "$INSTALL_DIR" ]]; then
            INSTALL_DIR="${HOME}/Applications"
            mkdir -p "$INSTALL_DIR"
          fi
          TARGET_APP="${INSTALL_DIR}/Paseo.app"

          if pgrep -x "Paseo" >/dev/null 2>&1; then
            echo "==> Closing running Paseo.app ..."
            osascript -e 'tell application "Paseo" to quit' >/dev/null 2>&1 || true
            for _ in 1 2 3 4 5; do
              pgrep -x "Paseo" >/dev/null 2>&1 || break
              sleep 1
            done
            pkill -x "Paseo" >/dev/null 2>&1 || true
          fi

          echo "==> Mounting ${DMG_NAME} ..."
          hdiutil attach "${TMP_DIR}/${DMG_NAME}" -nobrowse -readonly -mountpoint "$MNT_DIR" -quiet

          echo "==> Installing Paseo.app to ${TARGET_APP} ..."
          rm -rf "$TARGET_APP"
          ditto "${MNT_DIR}/Paseo.app" "$TARGET_APP"
          xattr -cr "$TARGET_APP"
          codesign --verify --deep --strict "$TARGET_APP"

          hdiutil detach "$MNT_DIR" -quiet || true

          echo "==> Installed successfully: ${TARGET_APP}"
          if [[ "${PASEO_NO_OPEN:-0}" != "1" ]]; then
            echo "==> Launching Paseo.app ..."
            open -a "$TARGET_APP"
          fi
          INSTALLER_EOF
          sed -i.bak "s/__DMG_FILE__/${DMG_FILE}/g" "$INSTALLER_PATH"
          rm -f "${INSTALLER_PATH}.bak"
          chmod +x "$INSTALLER_PATH"
          bash -n "$INSTALLER_PATH"

          echo "=== Built release artifacts ==="
          ls -lh packages/desktop/release/
          (
            cd packages/desktop/release
            shasum -a 256 ./*.dmg ./*.zip ./install-macos.sh | tee SHA256SUMS.txt
          )

      - name: Upload packaged smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-macos-arm64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS arm64 installers to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paseo-macos-arm64
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/install-macos.sh
            packages/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on fork
        if: github.repository == 'Myasuka/paseo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="custom-macos-client"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Paseo Custom macOS Client (\`arm64\` Apple Silicon)

          Built from commit \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`), verified via \`PASEO_DESKTOP_SMOKE=1\` packaged desktop launch smoke test, \`arm64\` Mach-O addon audit, and \`codesign --verify --deep --strict\` ad-hoc signature.

          ### One-Command Install / Upgrade (Recommended)
          Run in Terminal on your Apple Silicon Mac (downloads \`.dmg\`, verifies SHA256, installs to \`/Applications/Paseo.app\`, strips Gatekeeper quarantine, and opens Paseo):

          \`\`\`bash
          curl -fsSL https://github.com/Myasuka/paseo/releases/download/custom-macos-client/install-macos.sh | bash
          \`\`\`

          ### Included Customizations
          - **LaTeX / KaTeX MathML Rendering (Chat & Markdown Preview)**: Native \`<math>\` MathML rendering for \`\$...$\` inline and \`\$\$...\$\$\` display formulas (including CJK-adjacent math and \`aligned\`/\`pmatrix\`), strict currency & shell \`\$\` protection, server + client Chat Find indexing for Unicode math symbols (\`α\`, \`θ\`, \`≤\`), and \`Cmd+C\` LaTeX source copy.
          - **Markdown Preview Find (\`Cmd+F\`)**: In-pane search bar with CSS Custom Highlight API highlighting, pane-focus-safe Selection fallback, match navigation (\`Enter\` / \`Shift+Enter\`), and auto-scroll.
          - **Changes Diff Find (\`Cmd+F\`)**: Full-model literal case-insensitive search across all diff hunks (including offscreen rows) with Canvas box highlights and vertical/horizontal auto-scroll.
          - **macOS Top Tab Shortcuts**: Switch workspace tabs with \`Cmd+Shift+[\` / \`Cmd+Shift+]\` (\`⌘⇧[\` / \`⌘⇧]\`), \`Cmd+Option+Left/Right\` (\`⌥⌘←\` / \`⌥⌘→\`) globally, or \`Cmd+Left/Right\` (\`⌘←\` / \`⌘→\`) when focus is outside text inputs, terminals, floating menus, and embedded browser views.
          - **In-App \`paseo://\` Agent Deep Links (Markdown)**: Recognize explicit, bare prose (with CJK/English punctuation boundaries), and inline-code \`paseo://h/<serverId>/agent/<agentId>\` links across chat messages, plan cards, file Markdown previews, and PR panels, navigating directly in-app across workspaces and archived conversations.

          ### Manual Install (\`.dmg\`)
          If installing manually from the \`.dmg\`, remove the macOS Gatekeeper quarantine attribute once after dragging \`Paseo.app\` into \`/Applications\`:

          \`\`\`bash
          xattr -cr /Applications/Paseo.app
          open -a /Applications/Paseo.app
          \`\`\`
          EOF

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "Paseo Custom macOS Client (arm64)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Paseo Custom macOS Client (arm64)" \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$RELEASE_TAG" \
            packages/desktop/release/*.dmg \
            packages/desktop/release/*.zip \
            packages/desktop/release/install-macos.sh \
            packages/desktop/release/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
